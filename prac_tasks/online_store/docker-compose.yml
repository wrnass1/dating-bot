services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: online_store
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d online_store"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/online_store
      DB_WAIT_TIMEOUT_S: "60"
    depends_on:
      db:
        condition: service_healthy

