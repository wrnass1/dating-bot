services:
  rabbitmq:
    # Use ECR Public mirror to avoid Docker Hub flakiness
    image: public.ecr.aws/docker/library/rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Compose (non-swarm) resource limits
    mem_limit: 512m
    cpus: 1.0

  redis:
    # Use ECR Public mirror to avoid Docker Hub flakiness
    image: public.ecr.aws/docker/library/redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    cpus: 1.0
