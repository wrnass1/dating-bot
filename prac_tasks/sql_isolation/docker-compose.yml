services:
  mysql:
    image: mysql:8.4
    container_name: sql-isolation-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: isolation_lab
    ports:
      - "3307:3306"
    command:
      - --transaction-isolation=READ-COMMITTED
      - --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
